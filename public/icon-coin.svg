<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pièce d'or planétaire">
  <defs>
    <radialGradient id="gold" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#fff4c4"/>
      <stop offset="35%" stop-color="#e8c56a"/>
      <stop offset="72%" stop-color="#c9a04a"/>
      <stop offset="100%" stop-color="#6b4e14"/>
    </radialGradient>
    <radialGradient id="planet" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#7ee8b8"/>
      <stop offset="40%" stop-color="#2d9a6a"/>
      <stop offset="75%" stop-color="#1a5a8a"/>
      <stop offset="100%" stop-color="#0f2848"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Pièce d'or -->
  <circle cx="16" cy="16" r="14.5" fill="url(#gold)" stroke="#4a3510" stroke-width="1.3"/>
  <circle cx="16" cy="16" r="12.8" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.7"/>
  <circle cx="16" cy="16" r="11.2" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.6"/>
  <!-- Planète au centre -->
  <circle cx="16" cy="16" r="7.8" fill="url(#planet)" filter="url(#glow)"/>
  <ellipse cx="13.2" cy="14.2" rx="2.8" ry="1.9" fill="#4ade80" opacity="0.8"/>
  <ellipse cx="18.5" cy="16.8" rx="2.2" ry="1.4" fill="#166534" opacity="0.65"/>
  <ellipse cx="15.8" cy="19.2" rx="1.6" ry="1" fill="#22c55e" opacity="0.5"/>
  <path d="M9.5 16 Q16 12.5 22.5 16" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.45"/>
  <path d="M9.8 18.5 Q16 21.5 22.2 18.5" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="0.4"/>
  <!-- Reflets -->
  <ellipse cx="11.5" cy="10.5" rx="3.5" ry="2" fill="#fff" opacity="0.22"/>
  <circle cx="23" cy="11.5" r="1.2" fill="#fff" opacity="0.14"/>
</svg>
